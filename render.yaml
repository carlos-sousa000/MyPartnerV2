services:
  - type: web
    name: mypartner-api
    runtime: python
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_CRED_JSON
        sync: false
      - key: USE_FIRESTORE
        value: "true"
      - key: REQUIRE_AUTH
        value: "true"
